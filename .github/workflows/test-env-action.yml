name: lint-build-test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_n_lint:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 9
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v2
      name: Checkout

    - uses: prefix-dev/setup-pixi@v0.9.4
      with:
        pixi-version: v0.63.2
        cache: true
    - run: pixi run lint
    - run: pixi run test
    - run: pixi run test_stubs
    - run: pixi run check_stub_drift
    - run: pixi run typecheck_stubs
    - run: pixi run typecheck_stubs_matrix
    - run: pixi run test_typing_policy
    - run: pixi run check_typing_policy_coverage
    - run: pixi run typecheck_report
    - run: pixi run typecheck_report_json
    - name: Write typing quality report
      run: pixi run python -m tools.report_pivy_typing --json pivy/coin.pyi > "typing-report-${{ matrix.os }}.json"
    - name: Upload typing quality report
      uses: actions/upload-artifact@v4
      with:
        name: pivy-typing-report-${{ matrix.os }}
        path: typing-report-${{ matrix.os }}.json
