[workspace]
authors = ["Lorenz Lechner <sppedflyer@gmail.com>"]
channels = ["conda-forge"]
description = "combining building and dependency management with pixi"
name = "pivy"
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "win-64", "osx-64"]
version = "0.6.11"

[dependencies]
python = "*"
swig = "*"
coin3d = "*"
cmake = "*"
ninja = "*"
soqt6 = "*"
qt6-main = "*"
pyside6 = "*"
simage = "*"
flake8 = "*"
mypy = "*"
pyright = ">=1.1.408,<2"
pyrefly = ">=0.61.1,<0.62"
typing-extensions = "*"


[target.linux-64.dependencies]
mesa-libgl-devel-cos7-x86_64 = "*"
gxx = "*"

[target.linux-aarch64.dependencies]
mesa-libgl-devel-cos7-aarch64 = "*"
gxx = "*"

[target.osx-arm64.dependencies]
clangxx = "*"

[target.osx-64.dependencies]
clangxx = "*"

[target.win-64.dependencies]
clangxx = "*"

[tasks]
configure = { cmd = ["cmake", "-G", "Ninja", "-B", "build", "-S", ".",
                     "-D", "CMAKE_BUILD_TYPE='Release'",
                     "-D", "CMAKE_INSTALL_PREFIX:FILEPATH=$CONDA_PREFIX",
                     "-D", "CMAKE_PREFIX_PATH=$CONDA_PREFIX",
                     "-D", "PIVY_USE_QT6:BOOL=ON",
                     "-D", "PIVY_USE_SOQT:BOOL=ON",
                     "-D", "QT_HOST_PATH=$CONDA_PREFIX" 
                     ], depends-on = []}

build = { cmd = ["python", "-m", "tools.ensure_pivy_build"]}
typing_build = { depends-on = ["build"]}
test = { cmd = ["python", "tests/coin_tests.py"], depends-on = ["build"]}
test_soqt = { cmd = ["python", "tests/soqt_tests.py"], depends-on = ["build"]}
test_quarter = { cmd = ["python", "tests/quarter_tests.py"], depends-on = ["build"]}
lint = { cmd = ["flake8", ".", "--count", "--select=E901,E999,F821,F822,F823",
                "--show-source", "--statistics", "--exclude=build,.pixi,.svn,CVS,.bzr,.hg,.git,__pycache__,.tox,.eggs,.egg,SoPyScript"]}
test_stubs = { cmd = ["python", "-m", "tools.validate_pivy_stubs"], depends-on = ["typing_build"]}
check_stub_drift = { cmd = ["python", "-m", "tools.check_pivy_stub_drift"], depends-on = ["typing_build"]}
check_stub_determinism = { cmd = ["python", "-m", "tools.check_pivy_stub_determinism"], depends-on = ["typing_build"]}
test_typing_policy = { cmd = ["python", "-m", "unittest", "tests/test_pivy_typing_policy.py"]}
test_typing_model = { cmd = ["python", "-m", "unittest", "tests/test_pivy_typing_model.py"]}
test_typing_pipeline = { cmd = ["python", "-m", "unittest", "tests/test_pivy_typing_pipeline.py"]}
test_typing_manifest = { cmd = ["python", "-m", "unittest", "tests/test_pivy_typing_manifest.py"]}
test_typing_producers = { cmd = ["python", "-m", "unittest", "tests/test_pivy_typing_producers.py"], depends-on = ["typing_build"]}
test_typing_callbacks = { cmd = ["python", "-m", "unittest", "tests/test_pivy_typing_callbacks.py"]}
test_typing_binding_friendliness = { cmd = ["python", "-m", "unittest", "tests/test_pivy_binding_friendliness.py"]}
check_typing_policy_coverage = { cmd = ["python", "-m", "tools.check_pivy_policy_coverage", "pivy/coin.pyi"]}
check_typing_compatibility = { cmd = ["python", "-m", "tools.check_pivy_typing_compatibility"]}
check_field_attribute_coverage = { cmd = ["python", "-m", "tools.check_pivy_field_coverage", "pivy/coin.pyi"], depends-on = ["typing_build"]}
typecheck_stubs_pyright = { cmd = ["pyright", "--warnings", "tests/typecheck"]}
typecheck_stubs_pyrefly = { cmd = ["pyrefly", "check", "--summary=none", "--search-path", ".", "tests/typecheck"]}
typecheck_stubs = { depends-on = ["typecheck_stubs_pyright", "typecheck_stubs_pyrefly"]}
typecheck_negative = { cmd = ["python", "-m", "tools.check_pivy_negative_typing"]}
typecheck_stubs_strict_pyright = { cmd = ["pyright", "--warnings", "tests/typecheck_strict"]}
typecheck_stubs_strict_pyrefly = { cmd = ["pyrefly", "check", "--summary=none", "--search-path", ".", "tests/typecheck_strict"]}
typecheck_stubs_strict = { depends-on = ["typecheck_stubs_strict_pyright", "typecheck_stubs_strict_pyrefly"]}
typecheck_stubs_matrix = { cmd = ["python", "-m", "tools.check_pivy_typing_matrix"]}
typecheck_report = { cmd = ["python", "-m", "tools.report_pivy_typing", "--check-baseline", "pivy/coin.pyi"]}
typecheck_report_json = { cmd = ["python", "-m", "tools.report_pivy_typing", "--json", "pivy/coin.pyi"]}
typecheck_coverage_report = { cmd = ["python", "-m", "tools.report_pivy_typing_suite", "--check", "--output", "build/typing/pivy-typing-coverage.json"]}
typecheck_binding_friendliness = { cmd = ["python", "-m", "tools.report_pivy_binding_friendliness", "pivy/coin.pyi", "--json", "--check-coverage", "--output", "build/typing/pivy-binding-friendliness.json"]}
typecheck_manifest = { cmd = ["python", "-m", "tools.generate_pivy_typing_manifest", "pivy/coin.pyi", "--output", "build/typing/pivy-api.json"]}
typecheck_manifest_baseline = { cmd = ["python", "-m", "tools.generate_pivy_typing_manifest", "pivy/coin.pyi", "--check-baseline"]}
typecheck_producer_comparison = { cmd = ["python", "-m", "tools.compare_pivy_typing_producers", "pivy/coin.pyi", "build/pivy/coin.pyi"], depends-on = ["typing_build"]}
typecheck_verifytypes = { cmd = ["python", "-m", "tools.report_pivy_verifytypes", "--check-baseline"], depends-on = ["typing_build"]}
typecheck_verifytypes_json = { cmd = ["python", "-m", "tools.report_pivy_verifytypes", "--json"], depends-on = ["typing_build"]}
typecheck_stubtest_coin = { cmd = ["python", "-m", "tools.check_pivy_stubtest", "--module", "pivy.coin"], depends-on = ["typing_build"]}
typecheck_stubtest_soqt = { cmd = ["python", "-m", "tools.check_pivy_stubtest", "--module", "pivy.gui.soqt"], depends-on = ["typing_build"]}
typecheck_stubtest = { depends-on = ["typecheck_stubtest_coin", "typecheck_stubtest_soqt"]}
typecheck_quality = { depends-on = ["typecheck_stubs", "typecheck_negative", "typecheck_stubs_strict", "typecheck_stubs_matrix", "test_typing_policy", "test_typing_model", "test_typing_pipeline", "test_typing_manifest", "test_typing_producers", "test_typing_callbacks", "test_typing_binding_friendliness", "check_typing_policy_coverage", "check_typing_compatibility", "check_field_attribute_coverage", "typecheck_report", "typecheck_coverage_report", "typecheck_binding_friendliness", "typecheck_manifest", "typecheck_manifest_baseline", "typecheck_producer_comparison", "typecheck_verifytypes", "test_stubs", "check_stub_drift", "check_stub_determinism", "typecheck_stubtest"]}
