[mypy]
# The generated SWIG surface intentionally has narrower overloads than the
# Python object protocol and occasionally repeats native overloads that mypy
# considers unreachable.  Pyright and Pyrefly remain the public stub gates;
# this config lets stubtest reach runtime parity checks for the curated names.
disable_error_code = assignment, misc, name-defined, overload-cannot-match, override
ignore_missing_imports = True
